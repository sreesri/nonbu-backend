services:
  - type: web
    name: nonbu-backend
    runtime: docker
    # Same region as the Neon database: every query is a round trip between the two.
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Neon connection string, e.g. postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Google OAuth *Web* client ID (comma-separate to allow several)
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
